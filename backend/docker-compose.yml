services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: music_catalog
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local_minio_user
      MINIO_ROOT_PASSWORD: local_minio_password
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # MinIO browser console
