[package]
name = "native_ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"] # cdylib/staticlib for Flutter FFI; lib so examples/ can link

[dependencies]
flutter_rust_bridge = "=2.13.0"
once_cell = "1.20"
cpal = "0.15"
spectrum-analyzer = "1.5"
pitch-detection = "0.3" 
realfft = "3.4"
num-complex = "0.4"
rubato = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
allo-isolate = "0.1.27"
tract-onnx = "0.23" # pure-Rust ONNX runtime for the bundled pitch model (no native libs: easy iOS/Android builds)

[dev-dependencies]
hound = "3.5" # WAV read/write for the replay and live harnesses

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


# The pitch model is ~10x slower unoptimised; keep `cargo test` usable.
[profile.dev.package."*"]
opt-level = 3
